# Secrets come from the environment or an untracked .env.docker: see .env.example.
# Startup fails with a clear message if a required value is missing.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bestkid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bestkid}
      POSTGRES_USER: ${DB_USER:-bestkid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    # Not published to the host: only the app can reach the database
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: bestkid-migrate
    command: ["pnpm", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bestkid}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-bestkid}?schema=public

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bestkid-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bestkid}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-bestkid}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/usr/src/app/uploads

volumes:
  postgres_data:
  uploads:
